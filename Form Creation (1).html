<html><head><meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
<title>Form Creation</title>
</head>
<body>
<form method="post" action="mailto:info@mysite.com">
<b>Enter your personal details below:</b><br><br>

Name: <input type="text" name="visitor_name" size="50"><br>
City: <input type="text" name="visitor_city" size="35">
State: <input type="text" name="visitor_state" size="35"><br>

Country:
<select name="visitor_country" size="1">
    <option>United States</option>
    <option>Australia</option>
    <option selected="">India</option>
    <option>Canada</option>
    <option>England</option>
    <option>France</option>
    <option>New Zealand</option>
</select>

Postal Code: <input type="text" name="visitor_code" size="10" maxlength="6"><br>

E-mail Address: <input type="text" name="visitor_email" size="50"><br>

Sex:
<input type="radio" name="sex" value="female">Female
<input type="radio" name="sex" value="male">Male
<br><br>

<b>Specify your interests:</b><br>
<input type="checkbox" name="interest" value="sports">Sports
<input type="checkbox" name="interest" value="movies">Movies
<input type="checkbox" name="interest" value="puzzles">Puzzles
<input type="checkbox" name="interest" value="jogging">Jogging
<input type="checkbox" name="interest" value="swimming">Swimming
<input type="checkbox" name="interest" value="net">Surfing the Net
<input type="checkbox" name="interest" value="others">Others
<br><br>

<b>Please rate my website:</b><br>
<input type="radio" name="rating" value="great" checked="">It's Great!
<input type="radio" name="rating" value="good">It's Good!
<input type="radio" name="rating" value="fair">It's Fair!
<input type="radio" name="rating" value="poor">It's Poor!
<br><br>

<h3 align="center">THANKS FOR VISITING!!!</h3>
<div align="center">
    <input type="submit" value="Submit">
    <input type="reset" value="Start Again">
</div>
</form>


</body></html>
