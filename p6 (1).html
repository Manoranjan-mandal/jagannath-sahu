<html>

    <title>Metals and Their Reasonable Cutting Speeds</title>
</head>
<body>

            </th>
        </tr>

        </tr>
        <tr bgcolor="yellow">
            <td height="40">Cast Iron</td>
            <td align="right">74</td>
            <td align="right">225</td>
        </tr>
        <tr>
            <td height="40">Brass</td>
            <td valign="bottom" align="center">300</td>
            <td valign="bottom" align="center">800</td>
        </tr>
        <tr bgcolor="yellow">
            <td height="40">Copper</td>
            <td align="left">300</td>
            <td align="left">1000</td>
        </tr>
    </table>

</html>
